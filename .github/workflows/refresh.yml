name: Refresh verified deals
on:
  schedule: [{ cron: "0 5 * * 1" }]   # every Monday, 05:00 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Optional browser for JavaScript-only pages (free)
        continue-on-error: true
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node pipeline/test.mjs && node pipeline/run.mjs
      - run: |
          git config user.name "wishora-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/deals.json data/report.json
          git diff --cached --quiet || (git commit -m "Refresh verified deals" && git push)
